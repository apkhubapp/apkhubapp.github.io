<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APKHub - Play Store & APK İndirme Mağazası</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d1117; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; }
    .brand-green { color: #00d061; }
    .bg-brand-green { background-color: #00d061; }
    .bg-brand-green:hover { background-color: #00b353; }
    .card-bg { background-color: #161b22; border: 1px solid #30363d; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-[#161b22]/95 backdrop-blur sticky top-0 z-40 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="renderApps('Tümü')">
        <div class="w-10 h-10 rounded-xl bg-brand-green flex items-center justify-center text-black font-extrabold text-xl shadow-lg shadow-green-500/20">
          <i class="fa-solid fa-cloud-arrow-down"></i>
        </div>
        <span class="text-2xl font-black tracking-tight text-white">APK<span class="brand-green">Hub</span></span>
      </div>

      <div class="flex-1 max-w-md hidden md:block">
        <div class="relative">
          <input id="searchInput" type="text" oninput="handleSearch()" placeholder="Uygulama veya oyun ara..." class="w-full bg-[#0d1117] border border-gray-700 rounded-full py-2 px-4 pl-10 text-sm focus:outline-none focus:border-[#00d061] transition">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-gray-400 text-sm"></i>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openPublishModal()" class="px-4 py-2 rounded-xl bg-brand-green text-black font-extrabold text-xs sm:text-sm flex items-center gap-2 shadow-lg shadow-green-500/20 hover:scale-105 active:scale-95 transition">
          <i class="fa-solid fa-plus-circle text-base"></i>
          <span>Uygulama Yayınla</span>
        </button>
      </div>
    </div>

    <!-- Mobile Search -->
    <div class="max-w-6xl mx-auto mt-2 md:hidden">
      <input id="mobileSearchInput" type="text" oninput="handleMobileSearch()" placeholder="Uygulama ara..." class="w-full bg-[#0d1117] border border-gray-700 rounded-xl py-2 px-3 text-xs focus:outline-none focus:border-[#00d061]">
    </div>
  </header>

  <!-- Categories -->
  <div class="border-b border-gray-800 bg-[#12161c] px-4 py-2.5 overflow-x-auto">
    <div class="max-w-6xl mx-auto flex items-center gap-2 text-xs font-semibold whitespace-nowrap" id="categoryPills">
      <button onclick="filterCategory('Tümü')" class="cat-pill px-3.5 py-1.5 rounded-full bg-brand-green text-black">Tümü</button>
      <button onclick="filterCategory('Aksiyon & FPS')" class="cat-pill px-3.5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700">Aksiyon & FPS</button>
      <button onclick="filterCategory('Oyunlar')" class="cat-pill px-3.5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700">Oyunlar</button>
      <button onclick="filterCategory('Araçlar')" class="cat-pill px-3.5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700">Araçlar</button>
      <button onclick="filterCategory('Sosyal')" class="cat-pill px-3.5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700">Sosyal</button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-gamepad brand-green"></i>
          <span id="sectionTitle">Öne Çıkan Uygulamalar</span>
        </h1>
        <p class="text-xs text-gray-400 mt-1">Play Store tarzı doğrulanmış ve güvenli Android APK kataloğu</p>
      </div>
      <span id="appCount" class="text-xs bg-gray-800 text-gray-300 px-3 py-1 rounded-full font-mono">1 Uygulama</span>
    </div>

    <!-- App Grid -->
    <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Dynamic cards rendered here -->
    </div>
  </main>

  <!-- Publish App Modal -->
  <div id="publishModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="card-bg rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-gray-800 pb-3 mb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-upload brand-green"></i> Play Store'a Uygulama Yayınla
        </h3>
        <button onclick="closePublishModal()" class="text-gray-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="publishForm" onsubmit="handlePublish(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="block text-gray-300 font-semibold mb-1">Uygulama Adı *</label>
          <input required id="pName" type="text" placeholder="Örn: BlockpostTkss" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-white focus:border-[#00d061] focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-300 font-semibold mb-1">Geliştirici Adı *</label>
            <input required id="pDev" type="text" placeholder="Örn: Tkss Studio" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-white focus:border-[#00d061] focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-300 font-semibold mb-1">Kategori *</label>
            <select id="pCat" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-white focus:border-[#00d061] focus:outline-none">
              <option value="Aksiyon & FPS">Aksiyon & FPS</option>
              <option value="Oyunlar">Oyunlar</option>
              <option value="Araçlar">Araçlar</option>
              <option value="Sosyal">Sosyal</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-300 font-semibold mb-1">Sürüm *</label>
            <input required id="pVer" type="text" placeholder="Örn: v2.5.0" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-white focus:border-[#00d061] focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-300 font-semibold mb-1">APK Boyutu *</label>
            <input required id="pSize" type="text" placeholder="Örn: 25.4 MB" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-white focus:border-[#00d061] focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-gray-300 font-semibold mb-1">APK İndirme Linki (URL) *</label>
          <input required id="pUrl" type="url" placeholder="https://github.com/.../app.apk veya Drive linki" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-white focus:border-[#00d061] focus:outline-none">
        </div>

        <div>
          <label class="block text-gray-300 font-semibold mb-1">Uygulama İkonu (Galeriden Seç veya URL Gir)</label>
          <input id="pIconFile" type="file" accept="image/*" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2 text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-gray-800 file:text-green-400 mb-1.5">
          <input id="pIconUrl" type="text" placeholder="veya görsel linki yapıştırın (İsteğe bağlı)" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2 text-white text-[11px] focus:outline-none">
        </div>

        <div>
          <label class="block text-gray-300 font-semibold mb-1">Açıklama</label>
          <textarea id="pDesc" rows="3" placeholder="Uygulamanın özelliklerini kısaca anlatın..." class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-white focus:border-[#00d061] focus:outline-none"></textarea>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-brand-green text-black font-extrabold text-sm shadow-lg shadow-green-500/20 hover:opacity-95 transition mt-2">
          Hemen Yayınla
        </button>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="card-bg rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <button onclick="closeDetailModal()" class="absolute right-4 top-4 text-gray-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
    <p>© 2026 APKHub. Play Store & Android APK Dağıtım Platformu.</p>
  </footer>

  <script>
    // Initial / Default Apps
    const defaultApps = [
      {
        id: 'blockposttkss',
        name: 'BlockpostTkss',
        dev: 'Tkss Studio',
        cat: 'Aksiyon & FPS',
        ver: 'v2.5.0',
        size: '1.1 MB',
        rating: '4.8',
        icon: '',
        iconType: 'default',
        url: 'https://github.com/apkhubapp/apkhubapp.github.io/releases/download/V1.9.0/BlockpostTkss_v1.5.apk',
        desc: 'BlockpostTkss, retro voksel grafiklerle harmanlanmış taktiksel mobil FPS oyunudur. Kasa açma, klan savaşları ve aura koleksiyonları içerir.',
        sha: 'b9f6b313d5b0dc8db981fef16a78bac92eca8016860c460d586bab338c17bce0'
      }
    ];

    function getApps() {
      const stored = localStorage.getItem('apkhub_apps');
      return stored ? JSON.parse(stored) : defaultApps;
    }

    function saveApps(apps) {
      localStorage.setItem('apkhub_apps', JSON.stringify(apps));
    }

    let currentCategory = 'Tümü';

    function renderApps(cat = 'Tümü', query = '') {
      currentCategory = cat;
      const apps = getApps();
      const grid = document.getElementById('appGrid');
      grid.innerHTML = '';

      const filtered = apps.filter(app => {
        const matchesCat = (cat === 'Tümü' || app.cat === cat);
        const matchesQuery = (app.name.toLowerCase().includes(query.toLowerCase()) || app.dev.toLowerCase().includes(query.toLowerCase()));
        return matchesCat && matchesQuery;
      });

      document.getElementById('appCount').innerText = `${filtered.length} Uygulama`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500 text-sm">Bu kategoride veya aramada uygulama bulunamadı.</div>`;
        return;
      }

      filtered.forEach(app => {
        const card = document.createElement('div');
        card.className = 'card-bg rounded-2xl p-5 shadow-lg hover:border-green-500/40 transition flex flex-col justify-between';

        const iconHtml = app.icon 
          ? `<img src="${app.icon}" class="w-16 h-16 rounded-2xl object-cover shrink-0 border border-white/10 shadow-md">`
          : `<div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white text-2xl shrink-0 border border-white/10 shadow-md"><i class="fa-solid fa-gamepad"></i></div>`;

        card.innerHTML = `
          <div>
            <div class="flex items-start gap-4 mb-3">
              ${iconHtml}
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5">
                  <h3 class="font-bold text-white text-base truncate">${app.name}</h3>
                  <i class="fa-solid fa-circle-check text-green-400 text-xs shrink-0" title="Doğrulanmış"></i>
                </div>
                <p class="text-xs text-gray-400 truncate">${app.dev}</p>
                <div class="flex items-center gap-2 mt-1 text-[11px] text-gray-400">
                  <span class="text-yellow-400 font-bold"><i class="fa-solid fa-star text-[10px]"></i> ${app.rating || '4.8'}</span>
                  <span>•</span>
                  <span>${app.ver}</span>
                  <span>•</span>
                  <span>${app.size}</span>
                </div>
              </div>
            </div>
            <p class="text-xs text-gray-300 line-clamp-2 mb-4 leading-relaxed">${app.desc || 'Hızlı ve güvenli Android APK sürümü.'}</p>
          </div>

          <div class="flex items-center gap-2 pt-3 border-t border-gray-800">
            <a href="${app.url}" class="flex-1 py-2.5 rounded-xl bg-brand-green text-black font-extrabold text-xs flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition">
              <i class="fa-solid fa-download"></i> İndir (${app.size})
            </a>
            <button onclick="viewDetails('${app.id}')" class="px-3 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold" title="Detaylar">
              <i class="fa-solid fa-circle-info"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.innerText === cat) {
          btn.className = 'cat-pill px-3.5 py-1.5 rounded-full bg-brand-green text-black';
        } else {
          btn.className = 'cat-pill px-3.5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700';
        }
      });
      document.getElementById('sectionTitle').innerText = cat === 'Tümü' ? 'Öne Çıkan Uygulamalar' : `${cat} Uygulamaları`;
      renderApps(cat);
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value;
      renderApps(currentCategory, q);
    }

    function handleMobileSearch() {
      const q = document.getElementById('mobileSearchInput').value;
      renderApps(currentCategory, q);
    }

    function openPublishModal() {
      document.getElementById('publishModal').classList.remove('hidden');
      document.getElementById('publishModal').classList.add('flex');
    }

    function closePublishModal() {
      document.getElementById('publishModal').classList.add('hidden');
      document.getElementById('publishModal').classList.remove('flex');
    }

    function handlePublish(e) {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const dev = document.getElementById('pDev').value.trim();
      const cat = document.getElementById('pCat').value;
      const ver = document.getElementById('pVer').value.trim();
      const size = document.getElementById('pSize').value.trim();
      const url = document.getElementById('pUrl').value.trim();
      const desc = document.getElementById('pDesc').value.trim();
      const fileInput = document.getElementById('pIconFile');
      const urlInput = document.getElementById('pIconUrl').value.trim();

      const newApp = {
        id: 'app_' + Date.now(),
        name, dev, cat, ver, size, url, desc,
        rating: '5.0',
        icon: urlInput || ''
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          newApp.icon = evt.target.result;
          saveAndRefresh(newApp);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        saveAndRefresh(newApp);
      }
    }

    function saveAndRefresh(newApp) {
      const apps = getApps();
      apps.unshift(newApp);
      saveApps(apps);
      closePublishModal();
      document.getElementById('publishForm').reset();
      renderApps(currentCategory);
      alert('Tebrikler! "' + newApp.name + '" başarıyla APKHub mağazasında yayınlandı.');
    }

    function viewDetails(id) {
      const app = getApps().find(a => a.id === id);
      if (!app) return;
      const content = document.getElementById('detailContent');
      content.innerHTML = `
        <div class="flex items-center gap-3 mb-4">
          ${app.icon ? `<img src="${app.icon}" class="w-14 h-14 rounded-2xl object-cover">` : `<div class="w-14 h-14 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-2xl"><i class="fa-solid fa-gamepad"></i></div>`}
          <div>
            <h2 class="text-xl font-bold text-white">${app.name}</h2>
            <p class="text-xs text-gray-400">${app.dev} • ${app.cat}</p>
          </div>
        </div>
        <div class="text-xs text-gray-300 space-y-2 mb-4 bg-black/30 p-3 rounded-xl border border-gray-800">
          <div class="flex justify-between"><span>Sürüm:</span><span class="text-white font-mono">${app.ver}</span></div>
          <div class="flex justify-between"><span>Boyut:</span><span class="text-white font-mono">${app.size}</span></div>
          <div class="flex justify-between"><span>Durum:</span><span class="text-green-400 font-semibold">%100 Güvenli</span></div>
          ${app.sha ? `<div class="pt-2 border-t border-gray-800"><span class="text-gray-500 block mb-1">SHA-256:</span><span class="font-mono text-[10px] text-green-400 break-all select-all">${app.sha}</span></div>` : ''}
        </div>
        <p class="text-xs text-gray-300 mb-5 leading-relaxed">${app.desc || 'Bu uygulama için açıklama girilmemiş.'}</p>
        <a href="${app.url}" class="w-full py-3 rounded-xl bg-brand-green text-black font-extrabold text-xs flex items-center justify-center gap-2 hover:opacity-90">
          <i class="fa-solid fa-download"></i> Hemen İndir (${app.size})
        </a>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
    }

    // Run on load
    renderApps();
  </script>
</body>
</html>
